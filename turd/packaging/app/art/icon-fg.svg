<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#0d1d44"/><stop offset=".55" stop-color="#060b1c"/><stop offset="1" stop-color="#03060d"/>
    </radialGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb0ff"/><stop offset=".5" stop-color="#2f8cff"/><stop offset="1" stop-color="#0a3fa8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset=".35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="vclip"><path d="M262 470 Q262 330 512 330 Q762 330 762 470 L762 560 Q762 660 512 660 Q262 660 262 560 Z"/></clipPath>
  </defs>
  <g transform="translate(512 512) scale(0.68) translate(-512 -512)">
  <!-- helmet shell -->
  <circle cx="512" cy="512" r="330" fill="#0a1430" stroke="#2f8cff" stroke-width="34" filter="url(#glow)"/>
  <circle cx="512" cy="512" r="292" fill="none" stroke="#2f8cff" stroke-opacity=".25" stroke-width="6"/>
  <!-- visor -->
  <path d="M262 470 Q262 330 512 330 Q762 330 762 470 L762 560 Q762 660 512 660 Q262 660 262 560 Z" fill="url(#visor)" filter="url(#glow)"/>
  <g clip-path="url(#vclip)">
    <!-- XMB wave across the glass -->
    <path d="M230 560 C 330 500, 430 620, 530 560 S 730 500, 800 560" fill="none" stroke="#dbe9ff" stroke-opacity=".85" stroke-width="10" stroke-linecap="round"/>
    <path d="M230 600 C 330 540, 430 660, 530 600 S 730 540, 800 600" fill="none" stroke="#dbe9ff" stroke-opacity=".4" stroke-width="7" stroke-linecap="round"/>
    <rect x="240" y="320" width="560" height="360" fill="url(#glass)"/>
  </g>
  <path d="M262 470 Q262 330 512 330 Q762 330 762 470 L762 560 Q762 660 512 660 Q262 660 262 560 Z" fill="none" stroke="#bfe0ff" stroke-opacity=".9" stroke-width="12"/>
  <!-- HUD ticks -->
  
</g></svg>
