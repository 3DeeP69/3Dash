[package]
name = "turd"
version = "1.1.0"
description = "T.U.R.D. — Totally Unreliable & Really Dumb. A 3D helmet-HUD dashboard."
authors = ["Bossman"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "turd_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "gzip", "brotli", "deflate", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "time", "macros", "process", "sync"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_WiFi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Devices_Bluetooth_Advertisement",
  "Devices_Geolocation",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
