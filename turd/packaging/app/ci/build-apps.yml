# T.U.R.D. app builds. Lives at .github/workflows/build-apps.yml; the app sources are in
# turd/ (turd/web, turd/server, turd/packaging/app), next to whatever else is in the repo.
#
# Produces: Windows setup .exe + .msi, Android release APK. Tag a commit "v1.2.3" to
# also publish them as a GitHub Release.
#
# Signing (all optional; see packaging/app/SIGNING.md):
#   ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   WINDOWS_PFX_B64, WINDOWS_PFX_PASSWORD   (code-signing certificate for the installers)
name: build-apps
on:
  push:
    tags: ["v*"]          # tag = turd/VERSION, e.g. v1.1.0 -> GitHub Release with all three files
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: turd/packaging/app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.22.0" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "turd/packaging/app/src-tauri -> target" }
      - run: npm ci
      - name: Version (tag, else turd/VERSION)
        shell: bash
        run: |
          v="$(cat ../../VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; fi
          node -e "const f='src-tauri/tauri.conf.json',c=require('./'+f);c.version='$v';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      - run: node scripts/prepare-web.mjs ../../web
      - run: node scripts/build-server-sea.mjs win-msvc ../../server
      - name: Import code-signing certificate
        if: env.WINDOWS_PFX_B64 != ''
        env: { WINDOWS_PFX_B64: "${{ secrets.WINDOWS_PFX_B64 }}", WINDOWS_PFX_PASSWORD: "${{ secrets.WINDOWS_PFX_PASSWORD }}" }
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\turd.pfx", [Convert]::FromBase64String($env:WINDOWS_PFX_B64))
          $cert = Import-PfxCertificate -FilePath "$env:RUNNER_TEMP\turd.pfx" -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force)
          node -e "const f='src-tauri/tauri.conf.json',c=require('./'+f);c.bundle.windows.certificateThumbprint='$($cert.Thumbprint)';c.bundle.windows.digestAlgorithm='sha256';c.bundle.windows.timestampUrl='http://timestamp.digicert.com';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      - run: npx tauri build --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: turd-windows
          path: |
            turd/packaging/app/src-tauri/target/release/bundle/nsis/*.exe
            turd/packaging/app/src-tauri/target/release/bundle/msi/*.msi

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: turd/packaging/app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.22.0" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Release keystore from secrets
        env: { ANDROID_KEYSTORE_B64: "${{ secrets.ANDROID_KEYSTORE_B64 }}" }
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_B64 secret (the project key). Without it the APK could not update the one already on the Fold."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TURD_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          TURD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TURD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TURD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          v="$(cat ../../VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; fi
          IFS=. read -r a b c <<< "$v"
          export TURD_VERSION="$v" TURD_VERSION_CODE=$(( a * 10000 + b * 100 + c ))   # same rule as build-all.sh (1.1.0 -> 10100)
          npm run android:apk
          cp android/app/build/outputs/apk/release/app-release.apk "TURD-$v-android.apk"
      - uses: actions/upload-artifact@v4
        with: { name: turd-android, path: "turd/packaging/app/TURD-*-android.apk" }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with: { files: "out/**/*" }
